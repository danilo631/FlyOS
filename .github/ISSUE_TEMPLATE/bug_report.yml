name: Bug report
description: Report a reproducible Fly OS problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve Fly OS. Do not include passwords, private keys or other secrets."
  - type: input
    id: version
    attributes:
      label: Fly OS version
      placeholder: "0.6.0-alpha2"
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session
      options: ["Fly Shell / Wayland", "Plasma fallback / Wayland", "X11", "Live ISO", "Installer", "Other"]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce, expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant output from Fly Health or `fly-health`; remove personal information first.
