name: Publish Fly OS APT repository

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Repository channel
        required: true
        type: choice
        options: [dev, beta, stable]
        default: dev
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg
      - name: Resolve channel
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            CH='${{ inputs.channel }}'
          elif [[ "${GITHUB_REF_NAME}" == *-dev* || "${GITHUB_REF_NAME}" == *alpha* ]]; then
            CH=dev
          elif [[ "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *rc* ]]; then
            CH=beta
          else
            CH=stable
          fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
      - name: Build packages
        env:
          FLYOS_DEFAULT_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: make lint
      - name: Import archive signing key
        env:
          FLYOS_APT_PRIVATE_KEY: ${{ secrets.FLYOS_APT_PRIVATE_KEY }}
        run: |
          if [[ -z "$FLYOS_APT_PRIVATE_KEY" ]]; then
            echo 'Missing FLYOS_APT_PRIVATE_KEY secret' >&2
            exit 1
          fi
          install -d -m 700 ~/.gnupg
          printf '%s' "$FLYOS_APT_PRIVATE_KEY" | gpg --batch --import
      - name: Build signed APT tree
        env:
          FLYOS_CHANNEL: ${{ steps.channel.outputs.channel }}
          FLYOS_GPG_KEY: ${{ secrets.FLYOS_APT_KEY_FINGERPRINT }}
        run: |
          if [[ -z "$FLYOS_GPG_KEY" ]]; then
            echo 'Missing FLYOS_APT_KEY_FINGERPRINT secret' >&2
            exit 1
          fi
          ./build/build-apt-repo.sh
          test -s "dist/apt-repo/dists/$FLYOS_CHANNEL/InRelease"
          test -s "dist/apt-repo/dists/$FLYOS_CHANNEL/main/binary-amd64/Packages"
          grep -q '^Package: flyos-core$' "dist/apt-repo/dists/$FLYOS_CHANNEL/main/binary-amd64/Packages"
      - name: Publish apt branch
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp -a dist/apt-repo/. "$tmp/"
          git fetch origin apt:refs/remotes/origin/apt || true
          git worktree add --detach /tmp/flyos-apt
          cd /tmp/flyos-apt
          if git show-ref --verify --quiet refs/remotes/origin/apt; then
            git checkout -B apt refs/remotes/origin/apt
          else
            git checkout --orphan apt
            git rm -rf . >/dev/null 2>&1 || true
          fi
          # Preserve other channels and replace only the selected suite/pool.
          mkdir -p dists pool
          rm -rf "dists/$CHANNEL"
          cp -a "$tmp/dists/$CHANNEL" "dists/$CHANNEL"
          rm -rf pool/main/f/flyos
          mkdir -p pool/main/f
          cp -a "$tmp/pool/main/f/flyos" pool/main/f/flyos
          printf '# Fly OS APT repository\n\nGenerated by GitHub Actions. Do not edit package indexes manually.\n' > README.md
          git config user.name 'Fly OS Archive Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m "APT: publish $CHANNEL ${GITHUB_REF_NAME:-manual}" || exit 0
          git push origin HEAD:apt
