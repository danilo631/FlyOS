name: Import Fly OS source

on:
  push:
    branches: [main]
    paths:
      - '.fly-bootstrap/**'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild validated source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .fly-bootstrap/chunk-08 || exit 0
          cat .fly-bootstrap/chunk-* > /tmp/flyos-source.b64
          base64 -d /tmp/flyos-source.b64 > /tmp/flyos-source.tar.gz
          tar -xzf /tmp/flyos-source.tar.gz
          rm -rf .fly-bootstrap
          rm -f .github/workflows/import-flyos.yml
          git config user.name "Fly OS Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import Fly OS 0.6.0-alpha5 source"
          git push origin HEAD:main
