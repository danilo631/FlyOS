name: Publish Fly OS APT repository

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Repository channel
        required: true
        default: dev
        type: choice
        options:
          - dev
          - beta
          - stable
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    env:
      CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg
      - name: Build Fly packages
        run: make package
      - name: Import archive signing key
        env:
          PRIVATE_KEY: ${{ secrets.FLYOS_APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$PRIVATE_KEY" || { echo 'FLYOS_APT_GPG_PRIVATE_KEY is not configured' >&2; exit 2; }
          printf '%s\n' "$PRIVATE_KEY" | gpg --batch --import
          echo "FLYOS_GPG_KEY=$(gpg --batch --with-colons --list-secret-keys 'Fly OS Development Archive' | awk -F: '/^fpr:/ {print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build signed repository
        run: FLYOS_CHANNEL="$CHANNEL" FLYOS_GPG_KEY="$FLYOS_GPG_KEY" ./build/build-apt-repo.sh
      - name: Publish apt branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin apt:refs/remotes/origin/apt
          git worktree add /tmp/fly-apt origin/apt
          rm -rf "/tmp/fly-apt/dists/$CHANNEL"
          mkdir -p /tmp/fly-apt/dists
          cp -a "dist/apt-repo/dists/$CHANNEL" /tmp/fly-apt/dists/
          mkdir -p /tmp/fly-apt/pool
          cp -a dist/apt-repo/pool/. /tmp/fly-apt/pool/
          cp dist/apt-repo/flyos-archive-key.asc /tmp/fly-apt/
          touch /tmp/fly-apt/.nojekyll
          cd /tmp/fly-apt
          git config user.name 'Fly OS Archive'
          git config user.email 'archive@flyos.local'
          git add -A
          git commit -m "Publish Fly OS $CHANNEL repository ${GITHUB_REF_NAME}" || exit 0
          git push origin HEAD:apt
