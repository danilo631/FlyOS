# Conservative Fly OS desktop defaults.
# Avoids risky cargo-cult tuning. Swappiness 100 pairs with high-priority zram;
# the kernel allows higher values for in-memory swap, but Fly OS keeps a
# conservative neutral value for mixed zram + disk-swap systems.
vm.swappiness = 100
vm.vfs_cache_pressure = 75
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
